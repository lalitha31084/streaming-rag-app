services:
  backend:
    build: ./backend
    container_name: streaming-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  worker:
    build: ./backend
    container_name: streaming-rag-worker
    command: ["python", "-u", "worker/worker.py"]
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7
    container_name: streaming-rag-redis
    ports:
      - "6379:6379"
    restart: always