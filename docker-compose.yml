version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: streaming-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma-data:/data/chroma
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: streaming-rag-worker
    env_file:
      - .env
    volumes:
      - chroma-data:/data/chroma
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: streaming-rag-redis
    ports:
      - "6379:6379"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streaming-rag-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  chroma-data: